<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Token Refresh — Hata</title>
  <style>
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box { text-align: center; max-width: 550px; }
    h1 { color: #f44336; }
    p { color: #999; margin-top: 0.5rem; }
    .detail {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #0d0d18;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #f44336;
      word-break: break-all;
      text-align: left;
      white-space: pre-wrap;
    }
    .tips {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #0d0d18;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #888;
      text-align: left;
    }
    .tips b { color: #ff9800; }
    code { background: #2a2a4a; padding: 0.1rem 0.3rem; border-radius: 3px; }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    #testResult {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #ff9800;
      display: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>&#10008; Baglanti Hatasi</h1>
    <p>ARC Vault API'ye ulasilamadi.</p>
    <div class="detail" id="detail">Detay yukleniyor...</div>
    <div class="tips">
      <b>Kontrol listesi:</b><br>
      1. API sunucusu calisiyor mu? <code>uvicorn app.main:app</code><br>
      2. Eklenti popup'indan API adresi dogru mu?<br>
      3. Tarayici konsolunda (<code>Ctrl+Shift+J</code>) hata var mi?
    </div>
    <button id="testBtn">API Baglantisini Test Et</button>
    <div id="testResult"></div>
  </div>
  <script src="error.js"></script>
</body>
</html>

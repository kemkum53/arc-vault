<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC Vault</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #2a2a4a;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(90deg, #00d2ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .status { font-size: 0.8rem; color: #666; }
    header .status.connected { color: #4caf50; }

    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    /* ── Login Card ── */
    .login-card {
      max-width: 420px; margin: 2rem auto;
      background: #12121f; border: 1px solid #1e1e36;
      border-radius: 14px; padding: 2rem;
    }
    .login-card h2 { font-size: 1.1rem; margin-bottom: 0.3rem; }
    .login-card p { font-size: 0.8rem; color: #666; margin-bottom: 1.25rem; }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label {
      display: block; font-size: 0.75rem; color: #888;
      margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    input {
      width: 100%; padding: 0.65rem 0.8rem; border-radius: 8px;
      border: 1px solid #2a2a4a; background: #0d0d18; color: #e0e0e0;
      font-size: 0.85rem; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #7b2ff7; }
    button {
      width: 100%; padding: 0.65rem 0.8rem; border-radius: 8px; border: none;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff); color: #fff;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; margin-top: 0.5rem;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid #7b2ff7; color: #7b2ff7; }
    .btn-sm { width: auto; padding: 0.4rem 1rem; font-size: 0.8rem; }
    .btn-danger { background: transparent; border: 1px solid #f4433666; color: #f44336; font-size: 0.78rem; }
    .btn-refresh {
      background: linear-gradient(135deg, #ff9800, #f44336);
      width: auto; padding: 0.4rem 1rem; font-size: 0.8rem; margin-top: 0;
    }
    .btn-refresh.refreshing { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── Data Panel ── */
    .data-panel { display: none; }
    .data-panel.show { display: block; }

    .sync-bar {
      display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;
      padding: 0.75rem 1rem; background: #12121f; border-radius: 10px;
      border: 1px solid #1e1e36; flex-wrap: wrap;
    }
    .sync-bar .info { font-size: 0.8rem; color: #888; flex: 1; }
    .sync-bar .info strong { color: #ccc; }
    .sync-actions { display: flex; gap: 0.5rem; align-items: center; }

    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid #1e1e36; margin-bottom: 1rem; }
    .tab {
      padding: 0.5rem 1rem; font-size: 0.8rem; color: #777; cursor: pointer;
      border: none; border-bottom: 2px solid transparent; background: none;
      width: auto; margin-top: 0; transition: all 0.2s;
    }
    .tab:hover { color: #bbb; }
    .tab.active { color: #00d2ff; border-bottom-color: #00d2ff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Profile Card ── */
    .profile-card {
      display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem;
      background: linear-gradient(135deg, #12121f 0%, #1a1a2e 100%);
      border: 1px solid #2a2a4a; border-radius: 12px; margin-bottom: 1rem;
    }
    .profile-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.2rem; color: #fff; flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-name { font-size: 1.05rem; font-weight: 700; color: #eee; }
    .profile-detail { font-size: 0.78rem; color: #777; margin-top: 0.15rem; }
    .profile-badges { display: flex; gap: 0.4rem; margin-top: 0.35rem; flex-wrap: wrap; }
    .profile-badge {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.15rem 0.5rem; border-radius: 5px; font-size: 0.68rem; font-weight: 600;
    }
    .profile-badge.linked { background: #1b3a2a; color: #4caf50; }
    .profile-badge.expired { background: #3a1b1b; color: #f44336; }
    .profile-badge.provider { background: #1a2a3e; color: #2196f3; }
    .profile-stats { display: flex; gap: 0.6rem; margin-left: auto; flex-wrap: wrap; }
    .stat-box { text-align: center; padding: 0.3rem 0.6rem; background: #0d0d18; border-radius: 8px; min-width: 60px; }
    .stat-box .val { font-size: 0.95rem; font-weight: 700; color: #eee; }
    .stat-box .val.gold { color: #ffd700; }
    .stat-box .val.cyan { color: #00d2ff; }
    .stat-box .val.green { color: #4caf50; }
    .stat-box .lbl { font-size: 0.6rem; color: #666; text-transform: uppercase; letter-spacing: 0.03em; }

    /* ── Rarity Colors ── */
    .rarity-Common { color: #aaa; }
    .rarity-Uncommon { color: #4caf50; }
    .rarity-Rare { color: #2196f3; }
    .rarity-Epic { color: #ce59ff; }
    .rarity-Legendary { color: #ff9800; }

    .rarity-border-Common { border-color: #444; }
    .rarity-border-Uncommon { border-color: #4caf5055; }
    .rarity-border-Rare { border-color: #2196f355; }
    .rarity-border-Epic { border-color: #ce59ff55; }
    .rarity-border-Legendary { border-color: #ff980055; }

    /* ── Inventory ── */
    .inv-grid { display: flex; flex-direction: column; gap: 2px; }
    .inv-row {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; background: #0d0d18; border-radius: 6px;
      border-left: 3px solid #333; transition: background 0.15s;
    }
    .inv-row:hover { background: #15152a; }
    .inv-img {
      width: 40px; height: 40px; object-fit: contain; border-radius: 4px;
      background: #1a1a2e; flex-shrink: 0;
    }
    .inv-info { flex: 1; min-width: 0; }
    .inv-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inv-sub { font-size: 0.68rem; color: #666; }
    .inv-qty {
      font-size: 0.85rem; font-weight: 700; color: #ccc;
      min-width: 30px; text-align: center;
    }
    .inv-dur {
      display: flex; align-items: center; gap: 0.3rem; min-width: 80px;
    }
    .dur-bar { width: 50px; height: 5px; background: #1e1e36; border-radius: 3px; overflow: hidden; }
    .dur-bar-fill { height: 100%; border-radius: 3px; }
    .dur-pct { font-size: 0.7rem; color: #888; min-width: 28px; }
    .inv-mods { display: flex; gap: 0.2rem; flex-wrap: wrap; }
    .mod-tag {
      display: inline-flex; align-items: center; gap: 0.2rem;
      padding: 0.1rem 0.4rem; background: #1e1e36; border-radius: 4px;
      font-size: 0.65rem; color: #aaa;
    }
    .mod-tag img { width: 16px; height: 16px; border-radius: 2px; }

    /* ── Inventory Filter ── */
    .inv-toolbar {
      display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; align-items: center;
    }
    .inv-toolbar input {
      max-width: 250px; padding: 0.4rem 0.7rem; font-size: 0.8rem;
    }
    .inv-toolbar select {
      padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid #2a2a4a;
      background: #0d0d18; color: #e0e0e0; font-size: 0.78rem; outline: none;
    }
    .inv-count { font-size: 0.75rem; color: #666; margin-left: auto; }

    /* ── Blueprint / Quest Grid ── */
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .item-card {
      background: #0d0d18; border: 1px solid #1e1e36; border-radius: 8px;
      padding: 0.6rem; text-align: center; transition: border-color 0.2s;
    }
    .item-card:hover { border-color: #7b2ff755; }
    .item-card img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 0.3rem; }
    .item-card .card-name { font-size: 0.72rem; font-weight: 600; line-height: 1.3; }
    .item-card .card-sub { font-size: 0.62rem; color: #666; margin-top: 0.15rem; }

    /* ── Quest groups ── */
    .quest-group { margin-bottom: 1.25rem; }
    .quest-group-title {
      font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem;
      padding-bottom: 0.35rem; border-bottom: 1px solid #1e1e36;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .quest-group-title .count {
      font-size: 0.7rem; font-weight: 400; color: #666;
      background: #1e1e36; padding: 0.1rem 0.5rem; border-radius: 10px;
    }
    .quest-item {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.3rem 0.6rem; background: #0d0d18; border: 1px solid #1e1e36;
      border-radius: 6px; font-size: 0.75rem; margin: 0.15rem;
    }
    .quest-check { color: #4caf50; }

    /* ── Hideout ── */
    .hideout-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.75rem;
    }
    .hideout-card {
      background: #0d0d18; border: 1px solid #1e1e36; border-radius: 10px;
      padding: 1rem;
    }
    .hideout-card .h-name { font-size: 0.9rem; font-weight: 700; color: #eee; }
    .hideout-card .h-sub { font-size: 0.72rem; color: #666; margin-top: 0.1rem; }
    .hideout-card .h-bar {
      display: flex; gap: 3px; margin-top: 0.6rem;
    }
    .hideout-card .h-dot {
      flex: 1; height: 8px; border-radius: 4px; background: #1e1e36;
    }
    .hideout-card .h-dot.filled { background: linear-gradient(135deg, #7b2ff7, #00d2ff); }
    .hideout-card .h-level {
      font-size: 0.75rem; color: #888; margin-top: 0.35rem; text-align: right;
    }

    /* ── Projects ── */
    .project-card {
      background: #0d0d18; border: 1px solid #1e1e36; border-radius: 10px;
      padding: 1rem; margin-bottom: 0.75rem;
    }
    .project-title { font-size: 0.95rem; font-weight: 700; color: #00d2ff; }
    .project-sub { font-size: 0.72rem; color: #666; margin-top: 0.1rem; }
    .phase-item {
      margin-top: 0.5rem; padding-left: 0.75rem;
      border-left: 2px solid #333;
    }
    .phase-item.complete { border-left-color: #4caf50; }
    .phase-item.active { border-left-color: #ff9800; }
    .phase-name { font-size: 0.8rem; font-weight: 600; }
    .phase-goal {
      font-size: 0.72rem; color: #999; margin: 0.15rem 0;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .phase-goal img { width: 18px; height: 18px; border-radius: 2px; }
    .phase-goal .goal-bar {
      width: 60px; height: 4px; background: #1e1e36; border-radius: 2px; overflow: hidden;
    }
    .phase-goal .goal-fill { height: 100%; background: #7b2ff7; border-radius: 2px; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: #555; font-size: 0.85rem; }

    /* ── Blueprint Filter ── */
    .bp-filter-btn {
      padding: 0.25rem 0.6rem; border-radius: 4px; border: 1px solid #2a2a4a;
      background: #0d0d18; color: #888; cursor: pointer; font-size: 0.7rem;
      transition: all 0.2s;
    }
    .bp-filter-btn:hover { border-color: #7b2ff755; color: #ccc; }
    .bp-filter-btn.active { background: #7b2ff7; color: #fff; border-color: #7b2ff7; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.75rem 1.25rem;
      border-radius: 10px; font-size: 0.82rem; font-weight: 500;
      transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #1b3a2a; color: #4caf50; border: 1px solid #2a5a3a; }
    .toast.error { background: #3a1b1b; color: #f44336; border: 1px solid #5a2a2a; }
    .toast.info { background: #1a2a3e; color: #2196f3; border: 1px solid #2a3a5a; }

    /* ── Account List ── */
    .acc-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.75rem; background: #0d0d18; border: 1px solid #1e1e36;
      border-radius: 8px; margin-bottom: 0.4rem; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .acc-item:hover { border-color: #7b2ff755; background: #15152a; }
    .acc-item.active { border-color: #7b2ff7; background: #1a1a3a; }
    .acc-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .acc-info { flex: 1; min-width: 0; }
    .acc-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acc-email { font-size: 0.68rem; color: #666; }
    .acc-badges { display: flex; gap: 0.3rem; flex-shrink: 0; }
    .acc-badge {
      font-size: 0.6rem; padding: 0.1rem 0.4rem; border-radius: 4px;
      background: #1e1e36; color: #888;
    }
    .acc-badge.linked { background: #1b3a2a; color: #4caf50; }
    .acc-badge.expired { background: #3a1b1b; color: #f44336; }
    .acc-badge.ok { background: #1b3a2a; color: #4caf50; }
    .acc-delete {
      width: 24px; height: 24px; border-radius: 4px; border: none;
      background: transparent; color: #555; cursor: pointer;
      font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .acc-delete:hover { background: #3a1b1b; color: #f44336; }

    /* ── Header Account Switcher ── */
    .header-accounts {
      display: flex; align-items: center; gap: 0.4rem; margin-left: auto;
    }
    .header-acc-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid #2a2a4a;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      color: #fff; font-size: 0.7rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .header-acc-btn:hover { transform: scale(1.1); }
    .header-acc-btn.active { border-color: #00d2ff; box-shadow: 0 0 8px #00d2ff44; }
    .header-acc-btn.expired { border-color: #f44336; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 2rem; color: #555; }
    .loading::after { content: ''; display: inline-block; width: 16px; height: 16px; border: 2px solid #555; border-top-color: #7b2ff7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 0.5rem; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <img src="/static/favicon.png" alt="" style="width:28px;height:28px;">
  <h1>ARC VAULT</h1>
  <div class="header-accounts" id="headerAccounts"></div>
  <a href="/extension" style="padding:0.4rem 0.9rem; border-radius:6px; background:linear-gradient(135deg,#7b2ff7,#00d2ff); color:#fff; font-size:0.75rem; font-weight:600; text-decoration:none; white-space:nowrap;">Eklenti Indir</a>
  <div class="status" id="statusText">Giris yapilmadi</div>
</header>

<div class="container">
  <!-- ── Hesap Listesi + Ekleme ── -->
  <div class="login-card" id="loginCard">
    <h2>Hesaplar</h2>
    <p>arctracker.io hesaplarini bagla ve aralarinda gecis yap.</p>

    <!-- Mevcut hesaplar -->
    <div id="accountList" style="margin-bottom:1rem;"></div>

    <!-- Yeni hesap ekleme formu (gizli) -->
    <div id="addAccountForm" style="display:none;">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="arcEmail" placeholder="arctracker email adresin">
      </div>
      <div class="form-group">
        <label>Sifre</label>
        <input type="password" id="arcPass" placeholder="arctracker sifren">
      </div>
      <button onclick="connectAndSync()" id="connectBtn">Bagla ve Sync Et</button>
      <button onclick="toggleAddForm(false)" style="margin-top:0.4rem; background:#1e1e36; color:#888;">Iptal</button>
    </div>

    <!-- Yeni hesap ekle butonu -->
    <button id="addAccountBtn" onclick="toggleAddForm(true)" style="background:linear-gradient(135deg,#1e1e36,#2a2a4a); color:#aaa; border:1px dashed #3a3a5a;">+ Yeni Hesap Ekle</button>
  </div>

  <!-- ── Data Panel ── -->
  <div class="data-panel" id="dataPanel">
    <div class="profile-card" id="profileCard" style="display:none;">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">-</div>
        <div class="profile-detail" id="profileDetail">-</div>
        <div class="profile-badges" id="profileBadges"></div>
      </div>
      <div class="profile-stats" id="profileStats"></div>
    </div>

    <div class="sync-bar">
      <div class="info">Son sync: <strong id="lastSync">-</strong></div>
      <div class="sync-actions">
        <button class="btn-sm btn-outline" onclick="triggerSync(true)">Sync</button>
        <button class="btn-sm btn-refresh" id="refreshBtn" onclick="refreshToken()">Token Yenile</button>
        <button class="btn-sm btn-danger" onclick="logout()">Hesaplara Don</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="inventory">Envanter</button>
      <button class="tab" data-tab="blueprints">Blueprintler</button>
      <button class="tab" data-tab="quests">Questler</button>
      <button class="tab" data-tab="hideout">Hideout</button>
      <button class="tab" data-tab="projects">Projeler</button>
    </div>

    <div class="tab-content active" id="tab-inventory"></div>
    <div class="tab-content" id="tab-blueprints"></div>
    <div class="tab-content" id="tab-quests"></div>
    <div class="tab-content" id="tab-hideout"></div>
    <div class="tab-content" id="tab-projects"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const CDN = 'https://cdn.arctracker.io/items/v2';
let accountId = localStorage.getItem('accountId');
let allAccounts = [];

// ── Game Data Cache ──
let gameItems = {};
let gameMods = {};
let gameQuests = {};
let gameHideout = {};
let gameProjects = {};
let gameBps = {};
let gameDataLoaded = false;

async function loadGameData() {
  if (gameDataLoaded) return;
  try {
    const [items, mods, quests, hideout, projects, bps] = await Promise.all([
      fetch('/static/data/items_reference.json').then(r => r.json()),
      fetch('/static/data/mods_reference.json').then(r => r.json()),
      fetch('/static/data/quests_reference.json').then(r => r.json()),
      fetch('/static/data/hideout_reference.json').then(r => r.json()),
      fetch('/static/data/projects_reference.json').then(r => r.json()),
      fetch('/static/data/blueprints_reference.json').then(r => r.json()),
    ]);
    gameItems = items;
    gameMods = mods;
    gameQuests = quests;
    gameHideout = hideout;
    gameProjects = projects;
    gameBps = bps;
    gameDataLoaded = true;
  } catch (e) {
    console.warn('Game data yuklenemedi:', e);
  }
}

// Sayfa yuklenince
loadGameData();
loadAccountList().then(() => {
  if (accountId) { showDataPanel(); loadData(); }
});

// ── Utils ──
async function apiCall(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
  return data;
}

function toast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Hesap Listesi ──
async function loadAccountList() {
  try {
    allAccounts = await apiCall('GET', '/accounts');
  } catch { allAccounts = []; }
  renderAccountList();
  renderHeaderAccounts();
}

function renderAccountList() {
  const el = document.getElementById('accountList');
  if (!allAccounts.length) {
    el.innerHTML = '<div style="text-align:center;color:#555;font-size:0.8rem;padding:1rem;">Henuz hesap eklenmemis</div>';
    return;
  }
  el.innerHTML = allAccounts.map(a => {
    const name = a.display_name || a.arctracker_email.split('@')[0];
    const tag = a.display_name_discriminator ? `#${a.display_name_discriminator}` : '';
    const isActive = a.id === accountId;
    let badges = '';
    if (a.is_token_expired) badges += '<span class="acc-badge expired">Token Dolmus</span>';
    else if (a.is_linked) badges += '<span class="acc-badge ok">Aktif</span>';
    if (a.provider) badges += `<span class="acc-badge">${a.provider}</span>`;
    return `
      <div class="acc-item ${isActive ? 'active' : ''}" onclick="switchAccount('${a.id}')">
        <div class="acc-avatar">${name.charAt(0).toUpperCase()}</div>
        <div class="acc-info">
          <div class="acc-name">${name}${tag}</div>
          <div class="acc-email">${a.arctracker_email}</div>

  }).join('');
}

function renderHeaderAccounts() {
  const el = document.getElementById('headerAccounts');
  if (!allAccounts.length || !accountId) { el.innerHTML = ''; return; }
  el.innerHTML = allAccounts.map(a => {
    const name = a.display_name || a.arctracker_email.split('@')[0];
    const isActive = a.id === accountId;
    const cls = isActive ? 'active' : (a.is_token_expired ? 'expired' : '');
    return `<button class="header-acc-btn ${cls}" onclick="switchAccount('${a.id}')" title="${name} — ${a.arctracker_email}">${name.charAt(0).toUpperCase()}</button>`;
  }).join('');
}

async function switchAccount(id) {
  if (id === accountId) return;
  accountId = id;
  localStorage.setItem('accountId', accountId);
  showDataPanel();
  renderAccountList();
  renderHeaderAccounts();
  await loadData();
  toast('Hesap degistirildi', 'info');
}

async function deleteAccount(id, name) {
  if (!confirm(`"${name}" hesabini silmek istediginize emin misiniz? Tum veriler silinecek.`)) return;
  try {
    await fetch(API + `/accounts/${id}`, { method: 'DELETE' });
    if (id === accountId) {
      accountId = null;
      localStorage.removeItem('accountId');
    }
    await loadAccountList();
    if (!accountId && allAccounts.length) {
      switchAccount(allAccounts[0].id);
    } else if (!allAccounts.length) {
      logout();
    }
    toast('Hesap silindi', 'success');
  } catch (e) { toast('Silme hatasi: ' + e.message, 'error'); }
}

function toggleAddForm(show) {
  document.getElementById('addAccountForm').style.display = show ? 'block' : 'none';
  document.getElementById('addAccountBtn').style.display = show ? 'none' : 'block';
  if (show) document.getElementById('arcEmail').focus();
}

function showDataPanel() {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('dataPanel').classList.add('show');
  document.getElementById('statusText').textContent = 'Bagli';
  document.getElementById('statusText').className = 'status connected';
}

function durColor(pct) {
  if (pct > 70) return '#4caf50';
  if (pct > 30) return '#ff9800';
  return '#f44336';
}

// Slug lookup — DB'de tier ayrı tutulduğu için "anvil" + tier "III" → "anvil_iii" olarak aranır
function resolveSlug(slug, tier) {
  if (gameItems[slug]) return slug;
  if (tier) {
    const tierSuffix = { I: '_i', II: '_ii', III: '_iii', IV: '_iv' }[tier];
    if (tierSuffix) {
      const full = slug + tierSuffix;
      if (gameItems[full]) return full;
    }
  }
  return slug;
}

function itemName(slug, tier) {
  const resolved = resolveSlug(slug, tier);
  const item = gameItems[resolved];
  return item ? item.name_tr : slug.replace(/_/g, ' ');
}

function itemImg(slug, tier) {
  const resolved = resolveSlug(slug, tier);
  const item = gameItems[resolved];
  return item?.image || `${CDN}/${resolved}.png`;
}

function itemRarity(slug, tier) {
  const resolved = resolveSlug(slug, tier);
  return gameItems[resolved]?.rarity || 'Common';
}

function itemType(slug, tier) {
  const resolved = resolveSlug(slug, tier);
  return gameItems[resolved]?.type || '';
}

function modName(slug) {
  const mod = gameMods[slug] || gameItems[slug];
  return mod ? mod.name_tr : slug.replace(/_/g, ' ');
}

function fmt(v) { return v != null ? v.toLocaleString('tr-TR') : '-'; }

// ── Bagla ve Sync ──
async function connectAndSync() {
  const email = document.getElementById('arcEmail').value.trim();
  const pass = document.getElementById('arcPass').value;
  if (!email || !pass) return toast('Email ve sifre girin', 'error');

  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.textContent = 'Baglaniyor...';

  try {
    let acc;
    try {
      acc = await apiCall('POST', '/accounts', { arctracker_email: email, arctracker_password: pass });
    } catch (e) {
      if (e.message.includes('zaten')) {
        const all = await apiCall('GET', '/accounts');
        acc = all.find(a => a.arctracker_email === email);
        if (!acc) throw new Error('Hesap bulunamadi');
      } else throw e;
    }
    accountId = acc.id;
    localStorage.setItem('accountId', accountId);
    await loadAccountList();
    toggleAddForm(false);
    showDataPanel();
    toast('Hesap baglandi, sync basliyor...', 'success');
    await triggerSync(true);
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Bagla ve Sync Et';
  }
}

// ── Sync ──
async function triggerSync(force = false) {
  if (!accountId) return;
  toast('Sync baslatildi...', 'info');
  try {
    const res = await apiCall('POST', `/accounts/${accountId}/sync`, { force });
    if (res.message) toast(res.message, 'info');
    else toast(`Sync tamam — ${res.synced_items} item, ${res.synced_blueprints} blueprint, ${res.synced_quests} quest`, 'success');
    await loadData();
  } catch (e) { toast(`Sync hatasi: ${e.message}`, 'error'); }
}

// ── Verileri Yukle ──
async function loadData() {
  if (!accountId) return;
  await loadGameData();
  try {
    const [acc, d] = await Promise.all([
      apiCall('GET', `/accounts/${accountId}`),
      apiCall('GET', `/accounts/${accountId}/data`),
    ]);
    renderProfile(acc);
    document.getElementById('lastSync').textContent =
      d.last_sync_at ? new Date(d.last_sync_at).toLocaleString('tr-TR') : 'Henuz sync yapilmadi';
    renderInventory(d.inventory);
    renderBlueprints(d.blueprints);
    renderQuests(d.quests);
    renderHideout(d.hideout);
    renderProjects(d.projects);
  } catch (e) {
    if (e.message.includes('404') || e.message.includes('bulunamadi')) logout();
  }
}

// ── Token Refresh ──
async function refreshToken() {
  if (!accountId) return;
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = 'Baslatiliyor...'; btn.classList.add('refreshing');
  try {
    const start = await apiCall('POST', `/accounts/${accountId}/refresh-token/start`);
    toast('Xbox login sayfasi aciliyor...', 'info');
    window.open(start.auth_url, '_blank');
    btn.textContent = 'Xbox Login Bekleniyor...';
    let attempts = 0;
    const poll = setInterval(async () => {
      attempts++;
      try {
        const st = await apiCall('GET', `/accounts/${accountId}/refresh-token/status`);
        if (st.status === 'success') {
          clearInterval(poll);
          await apiCall('POST', `/accounts/${accountId}/refresh-token/complete`);
          toast('Token yenilendi!', 'success');
          btn.disabled = false; btn.textContent = 'Token Yenile'; btn.classList.remove('refreshing');
          await loadData();
        } else if (['error','timeout','unchanged'].includes(st.status)) {
          clearInterval(poll);
          const r = await apiCall('POST', `/accounts/${accountId}/refresh-token/complete`);
          toast(r.message || 'Token yenilenemedi', 'error');
          btn.disabled = false; btn.textContent = 'Token Yenile'; btn.classList.remove('refreshing');
        } else if (attempts >= 60) {
          clearInterval(poll);
          toast('Zaman asimi', 'error');
          btn.disabled = false; btn.textContent = 'Token Yenile'; btn.classList.remove('refreshing');
        }
      } catch {}
    }, 3000);
  } catch (e) {
    toast(`Hata: ${e.message}`, 'error');
    btn.disabled = false; btn.textContent = 'Token Yenile'; btn.classList.remove('refreshing');
  }
}

  accountId = null;
  localStorage.removeItem('accountId');
  document.getElementById('loginCard').style.display = 'block';
  document.getElementById('dataPanel').classList.remove('show');

  document.getElementById('connectBtn').disabled = false;
  document.getElementById('connectBtn').textContent = 'Bagla ve Sync Et';
  toggleAddForm(false);
  renderAccountList();
  renderHeaderAccounts();
}

// ── Inventory ──
let _invItems = [];
function renderInventory(items) {
  _invItems = items;
  const el = document.getElementById('tab-inventory');
  if (!items.length) { el.innerHTML = '<div class="empty-state">Envanter bos — sync yaparak verileri cekin</div>'; return; }

  // Tipleri topla
  const types = new Set();
  items.forEach(it => types.add(itemType(it.item_id, it.tier) || 'Diger'));
  const typeOpts = [...types].sort().map(t => `<option value="${t}">${t}</option>`).join('');

  let html = `
    <div class="inv-toolbar">
      <input type="text" id="invSearch" placeholder="Ara..." oninput="filterInventory()">
      <select id="invType" onchange="filterInventory()"><option value="">Tum Tipler</option>${typeOpts}</select>
      <select id="invSort" onchange="filterInventory()">
        <option value="name">Isme Gore</option>
        <option value="qty">Miktara Gore</option>
        <option value="rarity">Nadirlige Gore</option>
        <option value="value">Degere Gore</option>
      </select>
      <div class="inv-count" id="invCount">${items.length} item</div>
    </div>
    <div class="inv-grid" id="invGrid"></div>
  `;
  el.innerHTML = html;
  filterInventory();
}

function filterInventory() {
  const search = (document.getElementById('invSearch')?.value || '').toLowerCase();
  const type = document.getElementById('invType')?.value || '';
  const sort = document.getElementById('invSort')?.value || 'name';
  const rarityOrder = { Common: 0, Uncommon: 1, Rare: 2, Epic: 3, Legendary: 4 };

  let filtered = _invItems.filter(it => {
    const name = itemName(it.item_id, it.tier).toLowerCase();
    const slug = it.item_id.toLowerCase();
    if (search && !name.includes(search) && !slug.includes(search)) return false;
    if (type && itemType(it.item_id, it.tier) !== type) return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (sort === 'qty') return b.quantity - a.quantity;
    if (sort === 'rarity') return (rarityOrder[itemRarity(b.item_id, b.tier)] || 0) - (rarityOrder[itemRarity(a.item_id, a.tier)] || 0);
    const rA = resolveSlug(a.item_id, a.tier), rB = resolveSlug(b.item_id, b.tier);
    if (sort === 'value') return ((gameItems[rB]?.value || 0) * b.quantity) - ((gameItems[rA]?.value || 0) * a.quantity);
    return itemName(a.item_id, a.tier).localeCompare(itemName(b.item_id, b.tier), 'tr');
  });

  document.getElementById('invCount').textContent = `${filtered.length} / ${_invItems.length} item`;

  const grid = document.getElementById('invGrid');
  let html = '';
  for (const it of filtered) {
    const rarity = itemRarity(it.item_id, it.tier);
    const name = itemName(it.item_id, it.tier);
    const type = itemType(it.item_id, it.tier);
    const img = itemImg(it.item_id, it.tier);
    const resolved = resolveSlug(it.item_id, it.tier);
    const val = gameItems[resolved]?.value;

    const durHtml = it.durability != null
      ? `<div class="inv-dur">
          <div class="dur-bar"><div class="dur-bar-fill" style="width:${it.durability}%;background:${durColor(it.durability)}"></div></div>
          <span class="dur-pct">${it.durability}%</span>
        </div>`
      : '';

    let modsHtml = '';
    if (it.mods?.length) {
      modsHtml = '<div class="inv-mods">' + it.mods.map(m => {
        const mn = modName(m.mod_id);
        const mi = itemImg(m.mod_id);
        return `<span class="mod-tag"><img src="${mi}" onerror="this.style.display='none'" alt="">${mn}</span>`;
      }).join('') + '</div>';
    }

    html += `
      <div class="inv-row rarity-border-${rarity}">
        <img class="inv-img" src="${img}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>';" alt="${name}" loading="lazy">
        <div class="inv-info">
          <div class="inv-name rarity-${rarity}">${name}</div>
          <div class="inv-sub">${type}${val ? ' — ' + fmt(val) + ' cr' : ''}${it.tier ? ' — T' + it.tier : ''}</div>
          ${modsHtml}
        </div>
        <div class="inv-qty">${it.quantity > 1 ? 'x' + it.quantity : ''}</div>
        ${durHtml}
      </div>`;
  }
  grid.innerHTML = html;
}

// ── Blueprints ──
function renderBlueprints(bps) {
  const el = document.getElementById('tab-blueprints');
  if (!bps.length) { el.innerHTML = '<div class="empty-state">Blueprint verisi yok</div>'; return; }

  const learned = bps.filter(b => b.learned);
  const unlearned = bps.filter(b => !b.learned);
  const total = bps.length;
  const pct = total > 0 ? Math.round(learned.length / total * 100) : 0;

  // Siralama: ogrenilmis once, sonra rarity'e gore
  const rarityOrder = { Legendary: 0, Epic: 1, Rare: 2, Uncommon: 3, Common: 4 };
  const sorted = [...learned, ...unlearned].sort((a, b) => {
    if (a.learned !== b.learned) return a.learned ? -1 : 1;
    return (rarityOrder[a.rarity] ?? 5) - (rarityOrder[b.rarity] ?? 5);
  });

  let html = `
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;">
      <div style="font-size:0.85rem;font-weight:600;color:#ccc;">
        <span style="color:#4caf50;">${learned.length}</span> / ${total} blueprint
        <span style="color:#888;font-weight:400;margin-left:0.3rem;">(${pct}%)</span>
      </div>
      <div style="flex:1;min-width:120px;max-width:300px;height:6px;background:#1e1e36;border-radius:3px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#7b2ff7,#00d2ff);border-radius:3px;"></div>
      </div>
      <div style="display:flex;gap:0.4rem;font-size:0.7rem;">
        <button class="bp-filter-btn active" data-filter="all" onclick="filterBlueprints('all',this)">Tumu</button>
        <button class="bp-filter-btn" data-filter="learned" onclick="filterBlueprints('learned',this)">Ogrenilmis</button>
        <button class="bp-filter-btn" data-filter="unlearned" onclick="filterBlueprints('unlearned',this)">Ogrenilmemis</button>
      </div>
    </div>
    <div class="card-grid" id="bpGrid">`;

  for (const b of sorted) {
    const id = b.blueprint_id;
    const name = b.name_tr || b.name_en || id.replace(/_/g, ' ');
    const img = b.image || `${CDN}/${id}.png`;
    const rarity = b.rarity || 'Common';
    const learnedCls = b.learned ? '' : 'unlearned';

    html += `
      <div class="item-card rarity-border-${rarity} bp-card ${learnedCls}" data-learned="${b.learned}">
        <img src="${img}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>';" alt="${name}" loading="lazy"
             style="${b.learned ? '' : 'opacity:0.3;filter:grayscale(100%);'}">
        <div class="card-name rarity-${rarity}" style="${b.learned ? '' : 'opacity:0.5;'}">${name}</div>
        <div style="font-size:0.6rem;margin-top:0.15rem;color:${b.learned ? '#4caf50' : '#555'};">${b.learned ? '✓ Ogrenildi' : '✗ Ogrenilmedi'}</div>
      </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

function filterBlueprints(filter, btn) {
  document.querySelectorAll('.bp-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.bp-card').forEach(card => {
    const learned = card.dataset.learned === 'true';
    if (filter === 'all') card.style.display = '';
    else if (filter === 'learned') card.style.display = learned ? '' : 'none';
    else card.style.display = learned ? 'none' : '';
  });
}

// ── Quests ──
function topoSortQuests(questIds, allQuests) {
  // Topolojik siralama: previous_quests'i olmayan (kok) questlerden baslayip zinciri takip et
  const visited = new Set();
  const sorted = [];

  function visit(id) {
    if (visited.has(id)) return;
    visited.add(id);
    const q = allQuests[id];
    if (q && q.previous_quests) {
      for (const prev of q.previous_quests) {
        if (questIds.has(prev)) visit(prev);
      }
    }
    sorted.push(id);
  }

  for (const id of questIds) visit(id);
  return sorted;
}

function renderQuests(completedQuests) {
  const el = document.getElementById('tab-quests');
  const completedIds = new Set(completedQuests.map(q => q.quest_id));

  // Tum questleri trader'a gore grupla
  const groups = {};
  for (const [qId, qData] of Object.entries(gameQuests)) {
    const trader = qData.trader || 'Diger';
    if (!groups[trader]) groups[trader] = { all: new Set(), completed: new Set() };
    groups[trader].all.add(qId);
    if (completedIds.has(qId)) groups[trader].completed.add(qId);
  }

  // Tamamlanmis ama reference'da olmayanlari da ekle
  for (const q of completedQuests) {
    const qData = gameQuests[q.quest_id];
    if (!qData) {
      const trader = 'Diger';
      if (!groups[trader]) groups[trader] = { all: new Set(), completed: new Set() };
      groups[trader].all.add(q.quest_id);
      groups[trader].completed.add(q.quest_id);
    }
  }

  const totalAll = Object.values(groups).reduce((s, g) => s + g.all.size, 0);
  const totalDone = completedIds.size;
  const pct = totalAll > 0 ? Math.round(totalDone / totalAll * 100) : 0;

  const traderColors = { Shani: '#ff9800', Celeste: '#2196f3', 'Tian Wen': '#4caf50', Apollo: '#ce59ff', Lance: '#f44336' };
  const traderOrder = ['Shani', 'Celeste', 'Apollo', 'Lance', 'Tian Wen', 'Diger'];

  let html = `
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;">
      <div style="font-size:0.85rem;font-weight:600;color:#ccc;">
        <span style="color:#4caf50;">${totalDone}</span> / ${totalAll} quest
        <span style="color:#888;font-weight:400;margin-left:0.3rem;">(${pct}%)</span>
      </div>
      <div style="flex:1;min-width:120px;max-width:300px;height:6px;background:#1e1e36;border-radius:3px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#7b2ff7,#00d2ff);border-radius:3px;"></div>
      </div>
      <div style="display:flex;gap:0.4rem;font-size:0.7rem;">
        <button class="bp-filter-btn active" onclick="filterQuests('all',this)">Tumu</button>
        <button class="bp-filter-btn" onclick="filterQuests('done',this)">Tamamlanan</button>
        <button class="bp-filter-btn" onclick="filterQuests('todo',this)">Yapilmamis</button>
      </div>
    </div>`;

  const sortedTraders = Object.keys(groups).sort((a, b) => {
    const ai = traderOrder.indexOf(a); const bi = traderOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  for (const trader of sortedTraders) {
    const g = groups[trader];
    const color = traderColors[trader] || '#888';
    const sortedIds = topoSortQuests(g.all, gameQuests);
    const doneCount = g.completed.size;
    const traderPct = g.all.size > 0 ? Math.round(doneCount / g.all.size * 100) : 0;

    html += `
      <div class="quest-group">
        <div class="quest-group-title">
          <span style="color:${color}">${trader}</span>
          <span class="count">${doneCount} / ${g.all.size}</span>
          <span style="font-size:0.65rem;color:#555;font-weight:400;">${traderPct}%</span>
        </div>
        <div>`;

    for (const qId of sortedIds) {
      const qData = gameQuests[qId] || {};
      const name = qData.name_tr || qData.name_en || qId.replace(/_/g, ' ');
      const done = g.completed.has(qId);
      const cls = done ? 'quest-done' : 'quest-todo';

      html += `<span class="quest-item ${cls}" data-done="${done}" style="${done ? '' : 'opacity:0.5;border-color:#1e1e36;'}">
        <span style="color:${done ? '#4caf50' : '#333'};">${done ? '&#10003;' : '&#9675;'}</span> ${name}
      </span>`;
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
}

function filterQuests(filter, btn) {
  document.querySelectorAll('.bp-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.quest-item').forEach(item => {
    const done = item.dataset.done === 'true';
    if (filter === 'all') item.style.display = '';
    else if (filter === 'done') item.style.display = done ? '' : 'none';
    else item.style.display = done ? 'none' : '';
  });
}

// ── Hideout ──
function renderHideout(modules) {
  const el = document.getElementById('tab-hideout');
  if (!modules.length) { el.innerHTML = '<div class="empty-state">Hideout verisi yok</div>'; return; }

  let html = '<div class="hideout-grid">';
  for (const m of modules) {
    const hData = gameHideout[m.module_id] || {};
    const name = hData.name_tr || hData.name_en || m.module_id.replace(/_/g, ' ');
    const nameEn = hData.name_en || '';
    const maxLvl = hData.max_level || Math.max(m.level, 5);

    let dots = '';
    for (let i = 0; i < maxLvl; i++) {
      dots += `<div class="h-dot ${i < m.level ? 'filled' : ''}"></div>`;
    }

    html += `
      <div class="hideout-card">
        <div class="h-name">${name}</div>
        <div class="h-sub">${nameEn !== name ? nameEn : ''}</div>
        <div class="h-bar">${dots}</div>
        <div class="h-level">Seviye ${m.level} / ${maxLvl}</div>
      </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

// ── Projects ──
function renderProjects(projects) {
  const el = document.getElementById('tab-projects');
  if (!projects.length) { el.innerHTML = '<div class="empty-state">Proje verisi yok</div>'; return; }

  let html = '';
  for (const p of projects) {
    const pData = gameProjects[p.embark_project_id] || {};
    const name = pData.name_tr || pData.name_en || p.project_name || p.embark_project_id;
    const nameEn = pData.name_en || '';

    html += `
      <div class="project-card">
        <div class="project-title">${name}</div>
        ${nameEn && nameEn !== name ? `<div class="project-sub">${nameEn}</div>` : ''}`;

    if (Array.isArray(p.phases)) {
      for (const ph of p.phases) {
        const complete = ph.currentComplete;
        const cls = complete ? 'complete' : 'active';
        const icon = complete ? '&#10003;' : '&#9679;';
        const color = complete ? '#4caf50' : '#ff9800';

        html += `<div class="phase-item ${cls}">
          <div class="phase-name" style="color:${color}">${icon} ${ph.phaseName || 'Faz ' + ph.phaseNumber}</div>`;

        if (ph.goals?.length) {
          for (const g of ph.goals) {
            const gName = itemName(g.itemId || g.itemName || '');
            const gImg = g.itemId ? itemImg(g.itemId) : '';
            const pct = g.required > 0 ? Math.min(100, (g.currentCount / g.required) * 100) : 0;
            html += `
              <div class="phase-goal">
                ${gImg ? `<img src="${gImg}" onerror="this.style.display='none'" alt="">` : ''}
                <span>${gName}: ${g.currentCount}/${g.required}</span>
                <div class="goal-bar"><div class="goal-fill" style="width:${pct}%"></div></div>
              </div>`;
          }
        }
        html += '</div>';
      }
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

// ── Tabs ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});
</script>

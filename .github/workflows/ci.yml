name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_API: arc-vault-api:latest
  IMAGE_WEB: arc-vault-web:latest
  API_TAR: arc-vault-api.tar.gz
  WEB_TAR: arc-vault-web.tar.gz
  HEALTH_URL: https://arc-vault.kemalkondakci.me/api/health

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Bagimliliklari kur
        run: pip install -r requirements-dev.txt

      - name: API testlerini calistir
        run: pytest
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          JWT_SECRET: "ci-test-secret"
          ENCRYPTION_KEY: "dGVzdGtleWZvcmNpdGVzdGluZ29ubHkxMjM0NTY3"
          INTERNAL_API_KEY: "ci-test-key"

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci

      - name: Web testlerini calistir
        run: npm test

      - name: TypeScript kontrolu
        run: npm run typecheck

  build-api:
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - name: API image build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_API }}

      - name: API image guvenlik taramasi
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_API }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: API image'i paketle
        if: github.event_name != 'pull_request'
        run: docker save "${IMAGE_API}" | gzip > "${API_TAR}"

      - name: API deploy artifact'i yukle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: ${{ env.API_TAR }}
          if-no-files-found: error
          retention-days: 1

  build-web:
    runs-on: ubuntu-latest
    needs: test-web
    steps:
      - uses: actions/checkout@v4

      - name: Web image build
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_WEB }}

      - name: Web image guvenlik taramasi
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Web image'i paketle
        if: github.event_name != 'pull_request'
        run: docker save "${IMAGE_WEB}" | gzip > "${WEB_TAR}"

      - name: Web deploy artifact'i yukle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: ${{ env.WEB_TAR }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: API artifact'i indir
        uses: actions/download-artifact@v4
        with:
          name: api-image

      - name: Web artifact'i indir
        uses: actions/download-artifact@v4
        with:
          name: web-image

      - name: SSH ayarla
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Image'lari sunucuya kopyala
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key \
            "${API_TAR}" \
            "${WEB_TAR}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/"

      - name: Sunucuda deploy et
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" <<'EOF'
            set -euo pipefail
            cd "${{ secrets.SERVER_PATH }}"
            docker load -i arc-vault-api.tar.gz
            docker load -i arc-vault-web.tar.gz
            rm -f arc-vault-api.tar.gz arc-vault-web.tar.gz
            docker compose --env-file .env up -d --no-build api web
            docker image prune -f
          EOF

      - name: Saglik kontrolu
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 -o /dev/null "${HEALTH_URL}"; then
              echo "OK: ${HEALTH_URL} saglikli."
              exit 0
            fi
            echo "Saglik denemesi ${i}/12 basarisiz, 5sn bekleniyor..."
            sleep 5
          done
          echo "HATA: ${HEALTH_URL} saglik kontrolu basarisiz."
          exit 1

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 22px 24px; display: flex; gap: 24px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tile { width: 84px; height: 84px; background: var(--bg-3); border: 1px solid var(--border-strong); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .nm { font-family: var(--font-ui); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-5); }
</style>
</head>
<body>
  <div class="col"><div class="tile" style="border-radius: 4px;"></div><div class="px">4 px</div><div class="nm">sm · chip</div></div>
  <div class="col"><div class="tile" style="border-radius: 6px;"></div><div class="px">6 px</div><div class="nm">default · btn / input</div></div>
  <div class="col"><div class="tile" style="border-radius: 8px;"></div><div class="px">8 px</div><div class="nm">md · card</div></div>
  <div class="col"><div class="tile" style="border-radius: 12px;"></div><div class="px">12 px</div><div class="nm">lg · modal</div></div>
  <div class="col"><div class="tile" style="border-radius: 999px;"></div><div class="px">999 px</div><div class="nm">pill · chip / avatar</div></div>
</body>
</html>

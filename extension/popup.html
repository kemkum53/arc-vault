<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      padding: 1rem;
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 700;
      background: linear-gradient(90deg, #00d2ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    .field { margin-bottom: 0.6rem; }
    label {
      display: block;
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }
    input {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #2a2a4a;
      background: #0d0d18;
      color: #e0e0e0;
      font-size: 0.8rem;
      outline: none;
    }
    input:focus { border-color: #7b2ff7; }
    button {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.4rem;
    }
    button:hover { opacity: 0.9; }
    .status {
      margin-top: 0.6rem;
      font-size: 0.75rem;
      color: #4caf50;
      text-align: center;
      display: none;
    }
    .info {
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px solid #1e1e36;
      font-size: 0.7rem;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>ARC Vault</h2>

  <div class="field">
    <label>API Adresi</label>
    <input type="url" id="apiBase" placeholder="http://localhost:8000">
  </div>

  <button id="saveBtn">Kaydet</button>
  <div class="status" id="status">Kaydedildi!</div>

  <div class="info">
    Bu eklenti Embark token yenilemesindeki<br>
    <strong>127.0.0.1:49172</strong> callback'ini yakalayarak<br>
    ARC Vault API'ye iletir.
  </div>

  <script src="popup.js"></script>
</body>
</html>

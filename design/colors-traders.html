<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 22px 24px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .pill {
    border: 1px solid; border-radius: var(--radius-md); padding: 12px 14px;
    background: var(--bg-2); display: flex; flex-direction: column; gap: 6px;
  }
  .head { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--fg-1); }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-4); }
  .role { font-family: var(--font-ui); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-5); }
</style>
</head>
<body>
  <div class="pill" style="border-color: rgba(255,122,89,0.45);">
    <div class="head"><span class="dot" style="background: #ff7a59;"></span><span class="name">Shani</span></div>
    <span class="hex">#FF7A59</span>
    <span class="role">Med / Survival</span>
  </div>
  <div class="pill" style="border-color: rgba(176,107,255,0.45);">
    <div class="head"><span class="dot" style="background: #b06bff;"></span><span class="name">Celeste</span></div>
    <span class="hex">#B06BFF</span>
    <span class="role">Tech / Mods</span>
  </div>
  <div class="pill" style="border-color: rgba(255,200,87,0.45);">
    <div class="head"><span class="dot" style="background: #ffc857;"></span><span class="name">Apollo</span></div>
    <span class="hex">#FFC857</span>
    <span class="role">Trade / Coin</span>
  </div>
  <div class="pill" style="border-color: rgba(77,208,225,0.45);">
    <div class="head"><span class="dot" style="background: #4dd0e1;"></span><span class="name">Lance</span></div>
    <span class="hex">#4DD0E1</span>
    <span class="role">Combat / Recon</span>
  </div>
  <div class="pill" style="border-color: rgba(102,187,106,0.45);">
    <div class="head"><span class="dot" style="background: #66bb6a;"></span><span class="name">Tian Wen</span></div>
    <span class="hex">#66BB6A</span>
    <span class="role">Field / Garden</span>
  </div>
</body>
</html>

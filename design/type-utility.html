<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-5); }
  .label { font-family: var(--font-ui); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-4); }
  .mono { font-family: var(--font-mono); font-weight: 400; font-size: 13px; color: var(--fg-3); }
  .stat { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.02em; color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .stat-row { display: flex; align-items: baseline; gap: 10px; }
  .stat-row .unit { font-family: var(--font-ui); font-weight: 500; font-size: 13px; color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="stack">
    <div class="label">API Adresi</div>
    <div class="meta">Rajdhani 600 · 11 / +0.14em · UPPER</div>
    <div style="height: 10px;"></div>
    <div class="mono">quest_apollo_001 · ak74_ii · equipment_bench</div>
    <div class="meta">JetBrains Mono 400 · 13 px · slugs &amp; IDs</div>
  </div>
  <div class="stack">
    <div class="stat-row"><span class="stat">172,511</span><span class="unit">Credits</span></div>
    <div class="meta">Chakra Petch 700 · 28 px · tabular-nums</div>
    <div style="height: 8px;"></div>
    <div class="stat-row"><span class="stat" style="color: #00d2ff;">87</span><span class="unit">% Durability</span></div>
    <div class="meta">Same scale — accent color signals status</div>
  </div>
</body>
</html>

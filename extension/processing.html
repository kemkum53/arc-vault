<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Token Refresh — İşleniyor</title>
  <style>
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box { text-align: center; }
    h1 { color: #00d2ff; margin-bottom: 0.5rem; }
    p { color: #999; }
    .spinner {
      margin: 1.5rem auto;
      width: 40px; height: 40px;
      border: 4px solid #2a2a4a;
      border-top: 4px solid #7b2ff7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Token Yenileniyor...</h1>
    <p>Embark OAuth callback işleniyor, lütfen bekleyin.</p>
  </div>
</body>
</html>

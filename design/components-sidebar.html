<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-ui); }
  body { padding: 16px 18px; display: flex; gap: 18px; }
  .sidebar {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 12px 8px;
    width: 220px; display: flex; flex-direction: column; gap: 2px;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 10px 14px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .brand .logo { width: 24px; height: 24px; background: url("../assets/arc_vault_logo.png") center/contain no-repeat; }
  .brand .wm {
    font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em;
    background: linear-gradient(90deg, #00d2ff, #7b2ff7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand .wm .v { font-weight: 400; opacity: 0.92; }
  .nav {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: var(--radius); cursor: default; position: relative;
    color: var(--fg-3); font-size: 13px; font-weight: 500;
  }
  .nav svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav.active { color: var(--fg-1); background: linear-gradient(90deg, rgba(123,47,247,0.18), rgba(0,210,255,0.06)); }
  .nav.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(180deg, #7b2ff7, #00d2ff); border-radius: 2px; }
  .nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--fg-5); }
  .nav.active .count { color: #00d2ff; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <span class="wm">ARC<span class="v">VAULT</span></span>
    </div>
    <div class="nav active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Dashboard
    </div>
    <div class="nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="m3 16 9 5 9-5"/><path d="m3 12 9 5 9-5"/></svg>
      Envanter
      <span class="count">302</span>
    </div>
    <div class="nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Quests
      <span class="count">8 / 100</span>
    </div>
    <div class="nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 3v18"/><path d="M3 7h18"/><path d="M3 12h18"/><path d="M3 17h18"/></svg>
      Blueprints
      <span class="count">12</span>
    </div>
    <div class="nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35"/><path d="M2 8 12 2l10 6"/><path d="M6 18h12"/></svg>
      Hideout
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARC Vault — Dashboard</title>
  <link rel="icon" href="../../assets/icon48.png" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: var(--bg-1); color: var(--fg-2); font-family: var(--font-ui); }

    /* App-local helpers */
    .av-link {
      background: none; border: none; padding: 0;
      color: #00d2ff; cursor: pointer;
      font-family: var(--font-ui); font-weight: 600; font-size: 12;
      letter-spacing: 0.04em;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .av-link:hover { color: #7b2ff7; }
    .av-icon-btn {
      width: 36px; height: 36px;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      color: var(--fg-3);
      border-radius: var(--radius);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 180ms cubic-bezier(0.16,1,0.3,1);
    }
    .av-icon-btn:hover { color: var(--fg-1); border-color: rgba(123,47,247,0.5); }

    .av-btn:hover { opacity: 0.92; }
    .av-btn-secondary:hover { border-color: rgba(123,47,247,0.5) !important; color: var(--fg-1) !important; }
    .av-btn-ghost:hover     { color: var(--fg-1) !important; }
    .av-btn:active { transform: scale(0.985); }

    .av-tile:hover { transform: translateY(-1px); border-color: rgba(123,47,247,0.5); }

    @keyframes av-spin  { to { transform: rotate(360deg); } }
    @keyframes av-sweep { 0% { transform: translateX(-30%); } 100% { transform: translateX(130%); } }
    @keyframes av-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="mockData.js"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="Topbar.jsx"></script>
  <script type="text/babel" src="ConnectScreen.jsx"></script>
  <script type="text/babel" src="InventoryScreen.jsx"></script>
  <script type="text/babel" src="QuestsScreen.jsx"></script>
  <script type="text/babel" src="HideoutScreen.jsx"></script>
  <script type="text/babel" src="ProjectsScreen.jsx"></script>
  <script type="text/babel" src="DashboardScreen.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

  <script type="text/babel">
    // Wait for all the deferred scripts (Babel-compiled) to register window.App
    const mount = () => {
      if (!window.App) { requestAnimationFrame(mount); return; }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    };
    mount();
  </script>
</body>
</html>

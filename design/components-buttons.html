<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-ui); }
  body { padding: 22px 24px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  button {
    font-family: var(--font-ui); font-weight: 600;
    padding: 10px 22px; border-radius: var(--radius); border: none;
    font-size: 13px; letter-spacing: 0.06em; cursor: pointer;
    transition: all 220ms cubic-bezier(0.16,1,0.3,1);
  }
  .primary { background: linear-gradient(135deg, #7b2ff7, #00d2ff); color: #fff; }
  .primary:hover { opacity: 0.9; }
  .secondary { background: transparent; color: var(--fg-2); border: 1px solid var(--border-strong); }
  .ghost { background: transparent; color: var(--fg-3); border: none; padding: 10px 14px; }
  .danger { background: linear-gradient(135deg, #ff9800, #f44336); color: #fff; }
  .icon { width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--bg-2); border: 1px solid var(--border-strong); color: var(--fg-2); }
  .icon svg { width: 18px; height: 18px; }
  .pill { padding: 6px 14px; border-radius: 999px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <button class="primary">Senkronize Et</button>
    <button class="secondary">Bağlantı Testi</button>
    <button class="ghost">Vazgeç</button>
    <button class="danger">Hesabı Kaldır</button>
    <button class="icon" aria-label="refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.5-7.1"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button class="primary pill">Connect Embark</button>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 22px 24px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-5); display: flex; gap: 12px; }
  .display { font-family: var(--font-display); font-weight: 700; font-size: 48px; line-height: 1.05; letter-spacing: 0.02em; color: var(--fg-1); margin: 0; }
  .h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.15; letter-spacing: 0.02em; color: var(--fg-1); margin: 0; }
  .h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--fg-1); margin: 0; }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div class="display">SUPPLY DROP INCOMING</div>
      <div class="meta"><span>Chakra Petch 700</span><span>48 / 50.4 px</span><span>+0.02em</span></div>
    </div>
    <div>
      <div class="h1">Envanter Senkronize Edildi</div>
      <div class="meta"><span>Chakra Petch 700</span><span>32 / 37 px</span><span>+0.02em</span></div>
    </div>
  </div>
</body>
</html>
